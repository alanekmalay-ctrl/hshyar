<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>HSHYAR Host</title>
</head>
<body>
    <h1>HSHYAR Host</h1>
    <div id="status">Checking goldhen.bin...</div>

    <script>
        fetch("goldhen.bin")
            .then(response => {
                if (!response.ok) {
                    throw new Error("goldhen.bin not found");
                }

                document.getElementById("status").textContent =
                    "goldhen.bin was found successfully.";
            })
            .catch(error => {
                document.getElementById("status").textContent =
                    "Error: " + error.message;
            });
    </script>
</body>
</html>
